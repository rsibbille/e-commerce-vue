name: ecommerce-vue-dev

services:
  frontend:
    image: "${CI_REGISTRY_IMAGE:-ecommerce-vue}/frontend:${IMAGE_TAG:-dev}"
    build:
      context: ./frontend
      target: development
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3000
      ORDER_SERVICE_URL: http://order-service:3002
    ports:
      - "${DEV_FRONTEND_PORT:-8082}:8080"
    networks: [frontend, backend]
    depends_on: [auth-service, product-service, order-service]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  auth-service:
    image: "${CI_REGISTRY_IMAGE:-ecommerce-vue}/auth-service:${IMAGE_TAG:-dev}"
    build:
      context: ./services/auth-service
      target: development
    environment:
      APP_ENV: development
      CORS_ORIGIN: "${DEV_CORS_ORIGIN:-http://localhost:8082}"
      JWT_SECRET: "${DEV_JWT_SECRET:-dev_jwt_secret_change_me}"
      MONGODB_URI: mongodb://mongodb:27017/auth_dev
    networks: [backend, data]
    depends_on: [mongodb]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  product-service:
    image: "${CI_REGISTRY_IMAGE:-ecommerce-vue}/product-service:${IMAGE_TAG:-dev}"
    build:
      context: ./services/product-service
      target: development
    environment:
      APP_ENV: development
      CORS_ORIGIN: "${DEV_CORS_ORIGIN:-http://localhost:8082}"
      MONGODB_URI: mongodb://mongodb:27017/products_dev
    networks: [backend, data]
    depends_on: [mongodb]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  order-service:
    image: "${CI_REGISTRY_IMAGE:-ecommerce-vue}/order-service:${IMAGE_TAG:-dev}"
    build:
      context: ./services/order-service
      target: development
    environment:
      APP_ENV: development
      CORS_ORIGIN: "${DEV_CORS_ORIGIN:-http://localhost:8082}"
      JWT_SECRET: "${DEV_JWT_SECRET:-dev_jwt_secret_change_me}"
      MONGODB_URI: mongodb://mongodb:27017/orders_dev
      PRODUCT_SERVICE_URL: http://product-service:3000
    networks: [backend, data]
    depends_on: [mongodb]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mongodb:
    image: mongo:4.4.18
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      data:
        aliases: [mongodb]
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  mongodb_dev_data:

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
    internal: true
  data:
    driver: overlay
    internal: true
